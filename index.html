  <style>
    :root {
      --bg: #fcf9eb;
      --text: #22190f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Kanit", Tahoma, sans-serif;
      padding: 24px;
    }
    .document {
      width: min(100%, 820px);
      margin: 0 auto;
    }
    .poster {
      width: 100%;
      background: var(--bg);
      box-shadow: 0 12px 35px rgba(60, 42, 18, 0.12);
      overflow: hidden;
    }
    .poster + .poster { margin-top: 24px; }
    .poster img {
      display: block;
      width: 100%;
      height: auto;
    }
    @media print {
      body { padding: 0; background: #fff; }
      .poster { box-shadow: none; break-after: page; }
      .poster + .poster { margin-top: 0; }
      .poster:last-child { break-after: auto; }
    }
    @media (max-width: 720px) {
      body { padding: 0; }
      .document { width: 100%; }
      .poster { box-shadow: none; }
      .poster + .poster { margin-top: 0; }
    }
  </style>
